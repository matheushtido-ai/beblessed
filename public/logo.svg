<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dynamic Brush Gradients -->
    <linearGradient id="flagBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#084A9F" />
      <stop offset="60%" stop-color="#071A59" />
      <stop offset="100%" stop-color="#05123D" />
    </linearGradient>
    <linearGradient id="flagRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5162D" />
      <stop offset="100%" stop-color="#C50E22" />
    </linearGradient>
    <linearGradient id="brightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1596D2" />
      <stop offset="100%" stop-color="#084A9F" />
    </linearGradient>
  </defs>

  <!-- American Flag Brush Motif Emblem -->
  <g transform="translate(10, 10)">
    <!-- Blue Brush Canton with Flag shape -->
    <path d="M12 22 C 28 14, 52 16, 68 20 C 76 22, 84 28, 86 36 C 88 46, 78 54, 70 58 C 54 66, 32 64, 18 58 C 10 54, 8 42, 10 32 Z" fill="url(#flagBlueGrad)" />
    
    <!-- Stars in Canton (Crisp 5-point stars) -->
    <g fill="#FFFFFF" opacity="0.95">
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(10, 6)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(32, 6)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(54, 8)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(21, 24)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(43, 25)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(65, 27)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(32, 42)" />
      <polygon points="26,26 27.5,30 32,30 28.5,32.5 30,36.5 26,34 22,36.5 23.5,32.5 20,30 24.5,30" transform="scale(0.7) translate(54, 44)" />
    </g>

    <!-- Flowing Red Brush Stripes -->
    <!-- Top red stripe -->
    <path d="M72 18 C 88 16, 108 20, 122 28 C 120 32, 110 32, 98 30 C 86 28, 76 26, 70 24 Z" fill="url(#flagRedGrad)" />
    <!-- Middle red stripe with brush wave -->
    <path d="M78 34 C 94 34, 114 40, 126 50 C 120 54, 108 52, 94 48 C 84 46, 76 42, 74 38 Z" fill="url(#flagRedGrad)" />
    <!-- Lower sweeping red brush stroke -->
    <path d="M52 64 C 74 65, 102 68, 120 78 C 114 83, 98 81, 78 77 C 60 74, 42 71, 36 68 Z" fill="url(#flagRedGrad)" />
    <!-- Bottom accent wave -->
    <path d="M16 66 C 30 67, 54 74, 76 86 C 68 89, 44 86, 24 78 C 14 74, 12 70, 16 66 Z" fill="url(#flagRedGrad)" opacity="0.9" />

    <!-- Pure white brush streaks in-between -->
    <path d="M74 27 C 88 27, 104 31, 114 38 C 104 38, 92 35, 78 33 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M68 50 C 82 51, 102 56, 118 64 C 106 65, 90 62, 76 58 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Dynamic swoosh sparkle / spark dot -->
    <circle cx="123" cy="27" r="2.5" fill="#1596D2" />
    <circle cx="128" cy="51" r="3" fill="#E5162D" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(150, 20)">
    <!-- "BE BLESSED" in Architectural Deep Navy -->
    <text x="0" y="44" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="#071A59" class="brand-title">BE BLESSED</text>
    
    <!-- Red Accent Pip / Divider Dot -->
    <circle cx="340" cy="31" r="4.5" fill="#E5162D" />
    
    <!-- "SERVICES" in Royal Tracked Blue -->
    <text x="0" y="68" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="20" letter-spacing="7" fill="#084A9F" class="brand-services">SERVICES</text>

    <!-- Thin elegant patriotic accent line -->
    <line x1="165" y1="62" x2="350" y2="62" stroke="#E5162D" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Tagline: "Serving with Purpose" in refined cursive script -->
    <text x="5" y="93" font-family="'Alex Brush', 'Brush Script MT', 'Dancing Script', cursive" font-size="26" fill="#1596D2" font-style="italic" letter-spacing="0.5" class="brand-tagline">Serving with Purpose</text>
  </g>
</svg>
